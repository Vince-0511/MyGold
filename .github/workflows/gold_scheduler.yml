name: Daily Gold Price Auto-Updater

on:
  schedule:
    # 🎯 Triggers every single morning at 9:00 AM Malaysian Time (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows you to manually trigger it from GitHub anytime via a click button

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code Assets
      uses: actions/checkout@v4

    - name: Set up Python Environment Instance
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install firebase-admin requests

    - name: Execute Live Database Script Handshake
      env:
        # Pass your secret safe-key safely into the runner container process environment
        FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      run: python update_gold.py