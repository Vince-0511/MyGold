name: Live Gold Price Sync

on:
  push:
  schedule:
    - cron: '0 0,4,9 * * 1-5'  # 8am, 12pm, 5pm MYT (UTC+8) on weekdays
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install firebase-admin requests

      - name: Create Credentials File
        env:
          CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$CREDS" > serviceAccountKey.json
          python -c "import json,sys; json.load(open('serviceAccountKey.json'))" || { echo "ERROR: FIREBASE_SERVICE_ACCOUNT_JSON secret is missing or not valid JSON"; exit 1; }

      - name: Execute Sync Script
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python update_gold.py
