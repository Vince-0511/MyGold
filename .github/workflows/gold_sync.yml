# Force resync: Triggering scheduler index update
name: Live Gold Price Sync

on:
  schedule:
    - cron: '15 9-17 * * 1-5' # Runs at 15 minutes past every hour, 9am to 5pm, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          pip install firebase-admin requests

      - name: Execute Sync Script
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python update_gold.py
